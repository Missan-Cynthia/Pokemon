<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <title>寶可夢練習場</title>
  <link rel="icon" href="favicon-v2.ico">
  <link rel="apple-touch-icon" href="icon-v2.png">
  <style>
    :root { --ink:#172033; --muted:#64748b; --weak:.3; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; }
    body { margin:0; color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; background:#e8eef7; }
    button { font:inherit; touch-action:manipulation; }
    .hidden { display:none!important; }
    .app { min-height:100vh; }
    .start-screen { min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 20% 15%,#fde68a 0,transparent 28rem),radial-gradient(circle at 85% 15%,#bfdbfe 0,transparent 28rem),linear-gradient(145deg,#fff7ed,#eff6ff); }
    .start-card { width:min(850px,100%); padding:clamp(35px,8vw,80px); text-align:center; border:3px solid #fff; border-radius:34px; background:rgba(255,255,255,.88); box-shadow:0 24px 60px rgba(30,41,59,.18); }
    .eyebrow { margin:0 0 10px; color:#b91c1c; font-weight:900; letter-spacing:.16em; }
    h1 { margin:0; font-size:clamp(44px,9vw,88px); line-height:1.05; letter-spacing:-.05em; }
    .start-copy { margin:18px auto 30px; color:var(--muted); font-size:clamp(17px,2.5vw,22px); }
    .primary { min-width:220px; padding:16px 30px; border:0; border-radius:999px; color:white; background:linear-gradient(#fb5a5a,#b91c1c); box-shadow:0 8px 0 #7f1d1d,0 16px 30px rgba(185,28,28,.28); font-size:24px; font-weight:900; cursor:pointer; }
    .primary:active { transform:translateY(5px); box-shadow:0 3px 0 #7f1d1d; }
    .start-actions { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
    .secondary { min-width:190px; padding:15px 24px; border:2px solid #2563eb; border-radius:999px; color:#1d4ed8; background:#fff; box-shadow:0 6px 0 #bfdbfe; font-size:21px; font-weight:900; cursor:pointer; }
    .secondary:active { transform:translateY(4px); box-shadow:0 2px 0 #bfdbfe; }
    .dex-summary { display:flex; justify-content:center; gap:14px; margin-top:38px; flex-wrap:wrap; }
    .summary { min-width:155px; padding:13px 18px; border:1px solid #dbe4ef; border-radius:18px; background:#fff; }
    .summary span { display:block; color:var(--muted); }
    .summary strong { display:block; margin-top:2px; font-size:28px; }
    .battle-screen { min-height:100vh; padding:0 0 env(safe-area-inset-bottom); background:#dbe4ef; }
    .game { width:min(980px,100%); margin:0 auto; background:#f8fafc; box-shadow:0 0 50px rgba(15,23,42,.22); }
    .scene { position:relative; min-height:clamp(390px,52vh,560px); overflow:hidden; isolation:isolate; color:#fff; background:#548bd4; transition:background .5s; }
    .scene::before,.scene::after { content:""; position:absolute; z-index:-2; pointer-events:none; }
    .scene::before { inset:0; }
    .scene::after { left:-10%; right:-10%; bottom:-12%; height:42%; border-radius:50% 50% 0 0; }
    .scene-grassland::before { background:radial-gradient(circle at 82% 18%,#fff8a6 0 4%,transparent 4.5%),linear-gradient(#63b3ed 0 62%,#b9e66c 62%); }
    .scene-grassland::after { background:repeating-linear-gradient(100deg,#4f9b45 0 15px,#61ad4d 15px 30px); }
    .scene-stars::before { background:radial-gradient(circle at 15% 18%,#fff 0 1px,transparent 2px),radial-gradient(circle at 74% 25%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 45% 10%,#fde68a 0 2px,transparent 3px),linear-gradient(#080b2c,#312e81 70%,#111827); background-size:90px 80px,130px 110px,170px 150px,auto; }
    .scene-stars::after { background:#111827; box-shadow:0 -18px 45px #4338ca; }
    .scene-volcano::before { background:radial-gradient(circle at 75% 8%,#ffca80,transparent 18%),linear-gradient(#3b1111,#7f1d1d 65%,#25100b); }
    .scene-volcano::after { background:linear-gradient(150deg,#2b1710 20%,#7c2d12 21% 28%,#1c1210 29% 55%,#ef4444 56% 61%,#21110c 62%); }
    .scene-clouds::before { background:radial-gradient(ellipse at 20% 35%,#fff 0 9%,transparent 10%),radial-gradient(ellipse at 70% 28%,#fff 0 12%,transparent 13%),linear-gradient(#60a5fa,#dbeafe 70%); }
    .scene-clouds::after { background:radial-gradient(ellipse at 25% 20%,#fff 0 26%,transparent 27%),radial-gradient(ellipse at 65% 25%,#f8fafc 0 30%,transparent 31%),#dbeafe; }
    .scene-cliff::before { background:linear-gradient(#7dd3fc 0 62%,#d8c28d 62%); }
    .scene-cliff::after { background:linear-gradient(110deg,#76624e 0 36%,#b99b70 37% 63%,#5a4a3a 64%); transform:skewY(-5deg); }
    .scene-river::before { background:linear-gradient(#7dd3fc 0 55%,#7bbb5d 55% 70%,#38bdf8 70%); }
    .scene-river::after { height:28%; background:repeating-linear-gradient(175deg,rgba(255,255,255,.55) 0 3px,transparent 3px 24px),linear-gradient(#0ea5e9,#2563eb); }
    .scene-forest::before { background:radial-gradient(ellipse at 20% 12%,#3f8f46 0 17%,transparent 18%),radial-gradient(ellipse at 80% 10%,#2f7d3a 0 22%,transparent 23%),linear-gradient(#173f2a,#4f772d 68%,#263d21); }
    .scene-forest::after { background:repeating-linear-gradient(90deg,#203d20 0 7%,#355b2b 7% 15%,#294b24 15% 24%); opacity:.9; }
    .scene-desert::before { background:radial-gradient(circle at 80% 15%,#fff0a3 0 7%,transparent 7.5%),linear-gradient(#57b6e9 0 55%,#f4c66e 55%); }
    .scene-desert::after { background:linear-gradient(12deg,#c98d3d 0 30%,#f5c76c 31% 60%,#d9a449 61%); }
    .scene-snow::before { background:radial-gradient(circle,#fff 0 2px,transparent 3px),linear-gradient(#8ec5e8,#e7f5ff 70%); background-size:45px 45px,auto; }
    .scene-snow::after { background:linear-gradient(170deg,#bde3f8 0 30%,#fff 31% 60%,#d8effa 61%); }
    .scene-night::before { background:radial-gradient(circle at 78% 18%,#fff7bd 0 7%,transparent 7.5%),linear-gradient(#071b33,#163b63 72%,#142f36); }
    .scene-night::after { background:repeating-linear-gradient(105deg,#0c3326 0 12%,#174b35 12% 24%); }
    .hud { position:absolute; z-index:3; top:0; left:0; right:0; padding:12px clamp(12px,3vw,24px); background:linear-gradient(rgba(8,15,30,.72),transparent); text-shadow:0 2px 4px #000; }
    .hud-top,.hp-labels { display:flex; justify-content:space-between; align-items:center; gap:12px; font-weight:900; }
    .number,.scene-name { padding:6px 10px; border:1px solid rgba(255,255,255,.35); border-radius:999px; background:rgba(15,23,42,.42); }
    .collection-hud { padding:6px 10px; border:1px solid rgba(255,255,255,.55); border-radius:999px; color:#fff; background:rgba(15,23,42,.55); font-weight:900; cursor:pointer; }
    .timer.urgent { color:#fecaca; animation:pulse .7s infinite alternate; }
    .hp-labels { margin:8px 2px 5px; }
    .hp-track { height:18px; overflow:hidden; border:3px solid rgba(255,255,255,.92); border-radius:999px; background:rgba(15,23,42,.55); box-shadow:0 2px 8px rgba(0,0,0,.35); }
    .hp-fill { width:100%; height:100%; border-radius:999px; background:linear-gradient(90deg,#16a34a,#a3e635); transition:width .55s cubic-bezier(.2,.8,.2,1),background .25s; }
    .hp-fill.mid { background:linear-gradient(90deg,#f59e0b,#fde047); }
    .hp-fill.low { background:linear-gradient(90deg,#dc2626,#fb7185); }
    .stage { height:100%; min-height:clamp(390px,52vh,560px); display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding:86px 12px 18px; }
    .pokemon-image { width:min(330px,76vw); height:clamp(210px,32vh,350px); object-fit:contain; filter:drop-shadow(0 18px 10px rgba(0,0,0,.38)); transform-origin:bottom center; }
    .pokemon-image.hit { animation:shake .38s ease; }
    .pokemon-image.miss { animation:miss .28s ease; }
    .identity { width:min(720px,96%); padding:10px 14px; border:1px solid rgba(255,255,255,.38); border-radius:18px; text-align:center; background:rgba(7,18,35,.68); box-shadow:0 8px 24px rgba(0,0,0,.22); backdrop-filter:blur(7px); }
    .identity h2 { margin:0 0 7px; font-size:clamp(27px,5vw,43px); line-height:1.05; }
    .syllable-guide { display:flex; justify-content:center; flex-wrap:wrap; gap:5px; }
    .guide-item { min-width:52px; padding:4px 7px; border-radius:10px; color:#fff; transition:.2s; }
    .guide-char { display:block; font-size:18px; font-weight:900; }
    .guide-zhuyin { display:block; color:#dbeafe; font-size:20px; font-weight:900; white-space:nowrap; }
    .guide-item.current { color:#172033; background:#fde047; transform:translateY(-3px); box-shadow:0 5px 0 #ca8a04; }
    .guide-item.current .guide-zhuyin { color:#713f12; }
    .guide-item.done { background:rgba(22,163,74,.85); }
    .guide-item.weak { background:rgba(245,158,11,.85); }
    .guide-item.done .guide-char::after { content:" ✓"; }
    .control-zone { padding:10px clamp(6px,2vw,18px) max(12px,env(safe-area-inset-bottom)); background:linear-gradient(#f8fafc,#e8eef7); }
    .input-row { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; width:min(820px,100%); margin:0 auto 7px; }
    .input-label { color:#475569; font-weight:900; }
    .input-display { min-height:47px; display:flex; align-items:center; justify-content:center; padding:5px 12px; border:2px solid #93c5fd; border-radius:13px; background:#fff; color:#1e3a8a; font-size:27px; font-weight:900; letter-spacing:.08em; }
    .input-display.weak { border-color:#f59e0b; background:#fffbeb; }
    .mini-actions { display:flex; gap:5px; }
    .mini-action { min-width:48px; height:42px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; color:#475569; font-weight:900; cursor:pointer; }
    .message { min-height:28px; margin:0 auto 7px; text-align:center; font-size:18px; font-weight:900; }
    .message.good { color:#15803d; }.message.weak { color:#b45309; }.message.bad { color:#b91c1c; }
    .keyboard { width:min(940px,100%); margin:auto; display:grid; gap:5px; user-select:none; }
    .key-row { display:grid; gap:4px; }.key-row.row-11 { grid-template-columns:repeat(11,minmax(0,1fr)); }.key-row.row-10 { grid-template-columns:repeat(10,minmax(0,1fr)); }
    .key { height:clamp(46px,7.2vw,66px); padding:3px 1px; border:1px solid #b8c5d6; border-radius:9px; background:linear-gradient(#fff,#e8eef5); box-shadow:0 3px 0 #9aa9bb; color:#172033; cursor:pointer; transition:transform .08s,background .08s; }
    .key-physical { display:block; color:#64748b; font-size:clamp(10px,1.7vw,14px); font-weight:800; line-height:1; }.key-zhuyin { display:block; margin-top:2px; font-size:clamp(18px,3.7vw,27px); font-weight:900; line-height:1; }.key.tone .key-zhuyin { color:#a21caf; }
    .key.pressed,.key:active { transform:translateY(3px); background:#fde68a; box-shadow:0 0 0 #9aa9bb; }
    .keyboard-help { margin:8px 0 0; text-align:center; color:#64748b; font-size:13px; font-weight:700; }kbd { padding:2px 6px; border:1px solid #cbd5e1; border-radius:5px; background:#fff; box-shadow:0 1px 0 #94a3b8; }
    .collection-screen { position:fixed; z-index:50; inset:0; overflow-y:auto; padding:18px clamp(12px,4vw,40px) 50px; background:linear-gradient(150deg,#eff6ff,#fff7ed); }
    .collection-shell { width:min(1100px,100%); margin:auto; }
    .collection-top { position:sticky; z-index:2; top:0; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:12px 0; background:rgba(239,246,255,.94); backdrop-filter:blur(8px); }
    .back-button { padding:11px 16px; border:0; border-radius:12px; color:#fff; background:#1d4ed8; font-weight:900; cursor:pointer; }
    .collection-title { margin:0; text-align:center; font-size:clamp(27px,5vw,44px); }
    .collection-stats { display:flex; justify-content:center; gap:12px; margin:12px 0 16px; flex-wrap:wrap; color:#334155; font-size:18px; font-weight:900; }
    .collection-stats span { padding:9px 14px; border:1px solid #dbe4ef; border-radius:999px; background:#fff; }
    .collection-search { width:min(560px,100%); display:block; margin:0 auto 20px; padding:13px 16px; border:2px solid #93c5fd; border-radius:14px; background:#fff; font:inherit; font-size:18px; }
    .collection-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .collection-card { min-width:0; padding:12px 9px 14px; border:1px solid #dbe4ef; border-radius:18px; text-align:center; background:rgba(255,255,255,.94); box-shadow:0 8px 22px rgba(30,41,59,.1); }
    .collection-card img { width:100%; height:150px; object-fit:contain; filter:drop-shadow(0 8px 6px rgba(15,23,42,.18)); }
    .collection-number { color:#64748b; font-size:13px; font-weight:900; }
    .collection-name { margin:3px 0; font-size:20px; font-weight:1000; }
    .collection-zhuyin { min-height:42px; color:#1d4ed8; font-size:15px; font-weight:900; line-height:1.35; }
    .collection-empty { grid-column:1/-1; padding:60px 20px; text-align:center; color:#64748b; font-size:20px; font-weight:800; }
    .result-layer { position:absolute; z-index:10; inset:0; display:grid; place-items:center; padding:20px; text-align:center; color:#172033; background:rgba(248,250,252,.9); backdrop-filter:blur(5px); }
    .result-layer h3 { margin:12px 0 4px; font-size:clamp(34px,7vw,62px); }.result-layer p { margin:0; color:#64748b; font-size:20px; font-weight:800; }
    .capture-ball { width:112px; height:112px; position:relative; margin:auto; overflow:hidden; border:6px solid #1f2937; border-radius:50%; background:linear-gradient(#ef4444 0 46%,#1f2937 46% 54%,white 54%); animation:capture 1.2s ease-in-out both; }.capture-ball::after { content:""; position:absolute; width:28px; height:28px; left:50%; top:50%; transform:translate(-50%,-50%); border:6px solid #1f2937; border-radius:50%; background:white; }
    .escape-cloud { font-size:82px; animation:escape 1.1s ease-in both; }.damage-pop { position:absolute; z-index:6; top:42%; left:50%; transform:translate(-50%,-50%); padding:8px 14px; border-radius:999px; color:#fff; background:rgba(22,163,74,.9); font-size:24px; font-weight:1000; pointer-events:none; animation:pop .72s ease-out both; }.damage-pop.weak { background:rgba(217,119,6,.92); }.damage-pop.miss { background:rgba(185,28,28,.9); }
    @keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-13px) rotate(-2deg)}50%{transform:translateX(11px) rotate(2deg)}75%{transform:translateX(-6px)} }@keyframes miss { 0%,100%{filter:drop-shadow(0 18px 10px rgba(0,0,0,.38))}50%{filter:grayscale(1) drop-shadow(0 18px 10px rgba(0,0,0,.38))} }@keyframes pulse { from{transform:scale(1)}to{transform:scale(1.08)} }@keyframes pop { 0%{opacity:0;transform:translate(-50%,0) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)} }@keyframes capture { 0%{transform:translateY(-170px) rotate(0);opacity:0}45%{transform:translateY(0) rotate(360deg);opacity:1}65%{transform:rotate(-18deg)}82%{transform:rotate(18deg)}100%{transform:rotate(0)} }@keyframes escape { 0%{transform:translate(0,20px);opacity:0}35%{opacity:1}100%{transform:translate(145px,-110px);opacity:0} }
    @media (max-width:600px) { .scene,.stage{min-height:440px}.stage{padding-top:82px}.pokemon-image{height:255px;width:min(290px,76vw)}.identity{padding:8px 7px}.guide-item{min-width:44px;padding:3px 4px}.guide-char{font-size:16px}.guide-zhuyin{font-size:17px}.control-zone{padding-top:8px}.input-row{grid-template-columns:1fr auto}.input-label{display:none}.input-display{min-height:43px;font-size:23px}.key{height:48px;border-radius:7px}.key-physical{font-size:9px}.key-zhuyin{font-size:20px}.message{font-size:16px}.collection-top{grid-template-columns:auto 1fr}.collection-top::after{display:none}.collection-title{font-size:28px}.collection-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.collection-card img{height:125px}.collection-card{padding:9px 6px 12px}.collection-name{font-size:18px}.collection-zhuyin{font-size:14px}.collection-hud{font-size:0}.collection-hud::after{content:'📚';font-size:17px} }
    @media (max-width:390px) { .key-row{gap:2px}.key{border-radius:5px}.key-zhuyin{font-size:18px}.mini-action{min-width:43px} }
    @media (min-width:1100px) { .battle-screen{padding:18px 0}.game{border-radius:28px;overflow:hidden} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} }
    .wallet-bar { display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; padding:10px; background:#14213d; color:white; font-weight:800; }
    .wallet-bar button { padding:6px 12px; border:0; border-radius:8px; color:#14213d; background:#fff; cursor:pointer; }
    .duel-team { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:12px 0; }
    .duel-team button { min-width:0; padding:8px 4px; border:2px solid #cbd5e1; border-radius:12px; background:#eff6ff; color:#172033; font-weight:800; cursor:pointer; }
    .duel-team button[aria-pressed="true"] { border-color:#2563eb; background:#dbeafe; }
    .duel-team button:disabled { background:#e2e8f0; color:#475569; cursor:default; }
    .duel-team button[data-tired] { filter:grayscale(1); }
    .duel-team img { display:block; width:100%; height:56px; object-fit:contain; }
    #duelOptions { max-height:260px; overflow:auto; }
    #duelSearch { width:100%; margin:8px auto; }
    .charge-panel { display:grid; justify-items:center; gap:7px; margin:10px auto 0; }
    .charge-disc { --fill:0turn; --charge-color:#38bdf8; width:clamp(108px,28vw,142px); aspect-ratio:1; position:relative; isolation:isolate; display:grid; place-items:center; border:4px solid #334155; border-radius:50%; box-shadow:0 6px 0 #cbd5e1; background:#162339; color:#fff; }
    .charge-disc::before { content:""; position:absolute; z-index:-1; inset:4px; border-radius:50%; background:conic-gradient(var(--charge-color) 0 var(--fill),#425571 var(--fill) 1turn); }
    .charge-disc[data-full]::before { background:conic-gradient(#fa6b71,#ffcd56,#73ed96,#57d5ff,#9b80ff,#fa6b71); }
    .charge-disc strong { display:grid; place-items:center; width:72%; aspect-ratio:1; border-radius:50%; background:#17243a; font-size:clamp(23px,5vw,30px); }
    .charge-stats { display:flex; justify-content:center; gap:18px; color:#334155; font-weight:900; font-variant-numeric:tabular-nums; }
    .charge-stats span { min-width:7ch; }
    .duel-attack { margin:14px auto; }
    #duelScreen { width:min(960px,calc(100% - 20px)); max-width:none; padding:clamp(10px,2.5vw,24px); }
    #duelSetup,#duelTeam { max-width:560px; margin-inline:auto; }
    .duel-arena { border-radius:20px; min-height:clamp(265px,45vw,440px); color:white; }
    .duel-arena > .scene-name { position:absolute; top:10px; left:50%; translate:-50% 0; z-index:2; font-weight:800; white-space:nowrap; background:#172033dd; }
    .duel-fighters { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:end; gap:8px; min-height:inherit; padding:48px 10px 18px; }
    .duel-fighter { min-width:0; position:relative; display:grid; align-items:end; justify-items:center; }
    .duel-fighter:last-child { align-self:center; }
    .duel-image { width:min(100%,260px); height:clamp(105px,25vw,220px); object-fit:contain; filter:drop-shadow(0 13px 8px #0f172a90); }
    .duel-status { position:relative; z-index:2; width:min(100%,225px); padding:8px; border-radius:12px; background:#172033ed; font-weight:800; }
    .duel-status strong { display:block; overflow-wrap:anywhere; }
    .duel-status progress { display:block; width:100%; height:12px; accent-color:#4ade80; }
    .duel-impact { position:absolute; z-index:3; top:20%; left:50%; translate:-50% 0; color:#fff; font-weight:1000; font-size:clamp(22px,4vw,34px); text-shadow:0 2px 5px #172033,0 0 12px #b91c1c; pointer-events:none; }
    .duel-controls { max-width:510px; margin:12px auto 0; }
    .duel-attack { min-width:130px; font-size:20px; }
    #duelMessage { min-height:3em; }
    @media (max-width:420px) { .duel-arena { border-radius:14px; } .duel-fighters { padding-inline:5px; gap:4px; } .duel-status { font-size:13px; } }
    .reward { display:flex; align-items:center; justify-content:center; gap:14px; padding:8px; margin:8px auto; max-width:520px; border:2px solid #f5bd41; border-radius:16px; background:#fff6d6; color:#713f12; font-weight:800; }
    .reward img { width:70px; height:70px; object-fit:contain; animation:award .35s ease-out both; }
    @keyframes award { from { transform:translateX(-25px) scale(.65); opacity:0; } to { transform:none; opacity:1; } }
    .math-card { max-width:460px; margin:20px auto; padding:20px; border-radius:22px; background:#fff; text-align:center; }
    .math-card h2 { margin:0 0 10px; }
    .equation { font-size:clamp(36px,10vw,56px); font-weight:900; margin:12px 0; }
    .number-pad { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; max-width:315px; margin:auto; }
    .number-pad button { height:52px; font-weight:900; font-size:24px; }
    .practice-next { display:block; margin:10px auto; }
    .start-actions button { max-width:100%; min-width:min(100%,190px); }
    .start-card { padding-inline:clamp(14px,5vw,65px); }
    #homeNotice { margin:18px 0 0; color:#9a3412; font-weight:800; }
  </style>
</head>

  <section id="startScreen" class="start-screen" aria-labelledby="gameTitle"><div class="start-card"><h1 id="gameTitle">寶可夢練習場</h1><p class="start-copy">答題賺金幣，30 元組隊挑戰最多三場。</p><div class="start-actions"><button id="practiceButton" class="secondary">注音練習</button><button id="mathButton" class="secondary">九九乘法</button><button id="startButton" class="primary">三場對戰 · 30 元</button><button id="collectionStartButton" class="secondary">我的收藏</button></div><p id="homeNotice" class="hidden" role="status"></p><div class="dex-summary" aria-label="圖鑑進度"><div class="summary"><span>已收服數量</span><strong id="caughtCount">0</strong></div><div class="summary"><span>圖鑑完成度</span><strong id="dexPercent">0%</strong></div></div></div></section>

    <section class="control-zone"><div class="input-row"><span class="input-label">目前輸入</span><div id="inputDisplay" class="input-display" aria-live="polite">等待輸入</div><div class="mini-actions"><button id="deleteButton" class="mini-action" aria-label="刪除">⌫</button><button id="clearButton" class="mini-action" aria-label="清除">清除</button></div></div><div id="message" class="message" aria-live="polite">照著黃色目標輸入吧！</div><div id="zhuyinReward" class="reward hidden" role="status"><img alt=""><span></span></div><div id="keyboard" class="keyboard" aria-label="台灣標準注音鍵盤"></div><p class="keyboard-help">電腦可直接按實體鍵盤；<kbd>Space</kbd> 完成目前音節，<kbd>Backspace</kbd> 刪除，<kbd>Esc</kbd> 清除。</p></section>

<script src="pokemon-data.js"></script><script src="pokemon-zhuyin.js"></script>
<script>
(() => {
  'use strict';
  const STORAGE_KEY='pokemonZhuyinMachine.caughtIds',ROUND_SECONDS=60,WEAK_RATIO=.30;
  const KEY_ROWS=[[['1','ㄅ'],['2','ㄉ'],['3','ˇ'],['4','ˋ'],['5','ㄓ'],['6','ˊ'],['7','˙'],['8','ㄚ'],['9','ㄞ'],['0','ㄢ'],['-','ㄦ']],[['Q','ㄆ'],['W','ㄊ'],['E','ㄍ'],['R','ㄐ'],['T','ㄔ'],['Y','ㄗ'],['U','ㄧ'],['I','ㄛ'],['O','ㄟ'],['P','ㄣ']],[['A','ㄇ'],['S','ㄋ'],['D','ㄎ'],['F','ㄑ'],['G','ㄕ'],['H','ㄘ'],['J','ㄨ'],['K','ㄜ'],['L','ㄠ'],[';','ㄤ']],[['Z','ㄈ'],['X','ㄌ'],['C','ㄏ'],['V','ㄒ'],['B','ㄖ'],['N','ㄙ'],['M','ㄩ'],[',','ㄝ'],['.','ㄡ'],['/','ㄥ']]];
  const KEY_MAP=new Map(KEY_ROWS.flat().map(([key,value])=>[key,value])),TONES=new Set(['ˊ','ˇ','ˋ','˙']);
  const SCENES=[['grassland','草原'],['stars','星空'],['volcano','火山'],['clouds','雲端'],['cliff','山崖'],['river','河邊'],['forest','森林'],['desert','沙漠'],['snow','雪地'],['night','夜晚']];
  const el=id=>document.getElementById(id),data=Array.isArray(window.POKEMON_DATA)?window.POKEMON_DATA:[],zhuyinById=new Map((window.POKEMON_ZHUYIN||[]).map(item=>[Number(item.id),item])),roster=data.map(item=>({...item,zhuyin:zhuyinById.get(Number(item.id))})).filter(item=>item.zhuyin?.chars?.length);
  let caughtIds=loadCaught(),current=null,targets=[],targetIndex=0,composing='',hp=100,timeLeft=ROUND_SECONDS,timerId=null,locked=false,lastId=null,lastScene=-1,collectionReturnWasBattle=false;
  const WALLET_KEY = 'pokemonZhuyinMachine.wallet';
  const ROUND_COST = 30;
  let mode = 'home';
  let wallet = readWallet();
  let mathDeck = [];
  let mathQuestion;
  let mathAnswer = '';
  let mathSolved = false;

  function readWallet() {
    try {
      const saved = JSON.parse(localStorage.getItem(WALLET_KEY));
      if (Number.isSafeInteger(saved?.coins) && saved.coins >= 0 &&
          Number.isSafeInteger(saved.streak) && saved.streak >= 0) return saved;
    } catch {}
    return { coins: 0, streak: 0 };
  }

  function renderWallet() {
    el('coins').textContent = wallet.coins;
    el('streak').textContent = wallet.streak;
  }

  function saveWallet(coins, streak) {
    const updated = { coins, streak };
    localStorage.setItem(WALLET_KEY, JSON.stringify(updated));
    wallet = updated;
    renderWallet();
  }

  function awardCoins(rewardId, pokemon) {
    const streak = wallet.streak + 1;
    const hundredChance = Math.min(.02, .001 * streak);
    const tenChance = Math.min(.25, .05 + .01 * (streak - 1));
    const roll = Math.random();
    const bonus = roll < hundredChance ? 100 : roll < hundredChance + tenChance ? 10 : 0;
    saveWallet(wallet.coins + 1 + bonus, streak);
    const reward = el(rewardId);
    const giver = pokemon || randomPokemon();
    const image = reward.querySelector('img');
    image.hidden = !giver;
    if (giver) image.src = giver.image;
    reward.querySelector('span').textContent =
      (giver ? giver.name + '送來 ' : '獲得 ') + (1 + bonus) + ' 元' + (bonus ? '（含 ' + bonus + ' 元獎金）' : '');
    reward.classList.remove('hidden');
  }

  function resetStreak() {
    if (wallet.streak) saveWallet(wallet.coins, 0);
  }

  function showMode(nextMode) {
    stopTimer();
    mode = nextMode;
    const isBattle = mode === 'catch' || mode === 'zhuyin';
    el('startScreen').classList.toggle('hidden', mode !== 'home');
    el('battleScreen').classList.toggle('hidden', !isBattle);
    el('battleScreen').classList.toggle('practice', mode === 'zhuyin');
    el('battleScreen').setAttribute('aria-label', mode === 'zhuyin' ? '注音練習' : '抓寶挑戰');
    el('duelScreen').classList.toggle('hidden', mode !== 'duel');
    el('mathScreen').classList.toggle('hidden', mode !== 'math');
    el('homeButton').classList.toggle('hidden', mode !== 'math' && mode !== 'zhuyin');
    el('homeNotice').classList.add('hidden');
  }

  // Taiwan MEZASTAR Galaxy 3. The collection saves species, so use the highest card for that species.
  const officialStars = {"41":2,"42":3,"169":4,"179":2,"180":3,"181":5,"208":5,"246":2,"247":3,"248":4,"249":6,"250":6,"303":5,"353":2,"354":4,"359":4,"460":5,"465":5,"486":6,"524":2,"525":3,"526":4,"535":2,"536":3,"537":4,"551":2,"552":3,"553":4,"582":2,"583":3,"584":4,"599":2,"600":3,"601":4,"604":5,"650":2,"651":3,"652":5,"653":2,"654":3,"655":5,"656":2,"657":3,"658":5,"674":2,"675":3,"716":6,"717":6,"718":6,"776":5,"840":2,"841":4,"842":4,"861":5,"862":6,"869":6,"884":4,"894":5,"895":5,"922":3,"936":4,"985":5,"997":3,"1007":6,"1008":6};
  const attackCaps = [0, 0, 60, 95, 125, 155, 200];
  const chargeDuration = 3000;
  const chargeTiers = [
    { presses: 0, label: '0', fill: 0, power: 0, color: '#425571' },
    { presses: 1, label: '1/10', fill: 1 / 10, power: .35, color: '#60a5fa' },
    { presses: 2, label: '1/8', fill: 1 / 8, power: .45, color: '#22d3ee' },
    { presses: 3, label: '1/6', fill: 1 / 6, power: .55, color: '#4ade80' },
    { presses: 5, label: '1/4', fill: 1 / 4, power: .70, color: '#facc15' },
    { presses: 7, label: '1/2', fill: 1 / 2, power: .85, color: '#fb923c' },
    { presses: 8, label: '3/4', fill: 3 / 4, power: .91, color: '#f97316' },
    { presses: 9, label: '9/10', fill: 9 / 10, power: .96, color: '#f472b6' },
    { presses: 10, label: '全滿', fill: 1, power: 1, color: '#f472b6' },
  ];
  const maxChargePresses = chargeTiers.at(-1).presses;
  let duel;

  function starsFor(pokemon) { return officialStars[pokemon.id] || 2; }
  function gradeLabel(pokemon) {
    return '★' + starsFor(pokemon) + (officialStars[pokemon.id] ? '' : '（遊戲預設）');
  }

  function startPaidRound() {
    if (mode !== 'home') return;
    const officialRoster = roster.filter(pokemon => officialStars[pokemon.id]);
    const starters = officialRoster.filter(pokemon => starsFor(pokemon) <= 3);
    if (officialRoster.length < 3 || !starters.length || wallet.coins < ROUND_COST) {
      el('homeNotice').textContent = officialRoster.length < 3 || !starters.length
        ? '找不到可用的對戰資料。' : '還差 ' + (ROUND_COST - wallet.coins) + ' 元，可以先去練習賺金幣。';
      el('homeNotice').classList.remove('hidden');
      return;
    }
    const starter = starters[Math.floor(Math.random() * starters.length)];
    const pool = officialRoster.slice();
    const opponents = Array.from({length: 3}, () => pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    saveWallet(wallet.coins - ROUND_COST, wallet.streak);
    showMode('duel');
    duel = {
      round: 0, wins: 0, phase: 'setup', opponents, starter,
      selected: new Set([starter.id]), tired: new Set(),
      options: [starter, ...collectionItems().filter(pokemon => pokemon.id !== starter.id)],
    };
    el('duelScore').textContent = '選擇對戰隊伍';
    el('duelStarter').textContent = '本次支援：' + starter.name + ' ' + gradeLabel(starter);
    el('duelSearch').value = '';
    el('duelSetup').classList.remove('hidden');
    el('duelTeam').classList.add('hidden');
    el('duelField').classList.add('hidden');
    el('duelNext').classList.add('hidden');
    renderTeamOptions();
  }

  function memberButton(pokemon, label, select) {
    const button = document.createElement('button');
    button.type = 'button';
    const image = document.createElement('img');
    image.src = pokemon.image;
    image.alt = '';
    image.loading = 'lazy';
    button.append(image, document.createTextNode(pokemon.name + ' ' + gradeLabel(pokemon) + label));
    button.addEventListener('click', select);
    return button;
  }

  function renderTeamOptions() {
    const list = el('duelOptions');
    const term = el('duelSearch').value.trim();
    list.replaceChildren();
    for (const pokemon of duel.options) {
      if (term && !pokemon.name.includes(term)) continue;
      const picked = duel.selected.has(pokemon.id);
      const button = memberButton(pokemon, pokemon === duel.starter ? ' · 支援' : '', () => {
        if (duel.phase !== 'setup') return;
        if (duel.selected.has(pokemon.id)) duel.selected.delete(pokemon.id);
        else if (duel.selected.size < 3) duel.selected.add(pokemon.id);
        renderTeamOptions();
        list.querySelector('[data-id="' + pokemon.id + '"]')?.focus();
      });
      button.dataset.id = pokemon.id;
      button.setAttribute('aria-pressed', picked);
      button.disabled = !picked && duel.selected.size >= 3;
      list.appendChild(button);
    }
    el('duelBegin').disabled = duel.selected.size === 0;
    el('duelBegin').textContent = '確認隊伍（' + duel.selected.size + '／3）';
  }

  function chooseDuelMember() {
    duel.phase = 'choose';
    el('duelSetup').classList.add('hidden');
    el('duelTeam').classList.remove('hidden');
    el('duelField').classList.add('hidden');
    el('duelNext').classList.add('hidden');
    const opponent = duel.opponents[duel.round];
    el('duelScore').textContent = '選擇第 ' + (duel.round + 1) + ' 場隊員 · 對手 ' + opponent.name + ' ' + gradeLabel(opponent);
    renderDuelTeam();
    el('duelTeam').querySelector('button:not(:disabled)')?.focus();
  }

  function renderDuelTeam() {
    const list = el('duelTeam');
    list.replaceChildren();
    for (const pokemon of duel.team) {
      const tired = duel.tired.has(pokemon.id);
      const label = tired ? ' · 疲勞' : duel.phase === 'attack' && pokemon === duel.player ? ' · 上場' : '';
      const button = memberButton(pokemon, label, () => {
        if (duel.phase === 'choose' && !duel.tired.has(pokemon.id)) startDuelRound(pokemon);
      });
      button.disabled = tired || duel.phase !== 'choose';
      if (tired) button.dataset.tired = '';
      list.appendChild(button);
    }
  }

  function startDuelRound(player) {
    duel.opponent = duel.opponents[duel.round++];
    duel.player = player;
    duel.playerHp = el('duelPlayerBar').max = 85 + starsFor(player) * 15;
    duel.opponentHp = el('duelOpponentBar').max = 85 + starsFor(duel.opponent) * 15;
    const sceneIndex = (duel.round === 1 ? Math.floor(Math.random() * SCENES.length)
      : (duel.sceneIndex + 1 + Math.floor(Math.random() * (SCENES.length - 1))) % SCENES.length);
    duel.sceneIndex = sceneIndex;
    const [scene, sceneName] = SCENES[sceneIndex];
    el('duelArena').className = 'scene scene-' + scene + ' duel-arena';
    el('duelSceneName').textContent = sceneName;
    el('duelPlayerImage').src = player.image;
    el('duelPlayerName').textContent = player.name + ' ' + gradeLabel(player);
    for (const id of ['duelPlayerImage', 'duelImage', 'duelPlayerImpact', 'duelOpponentImpact']) {
      el(id).getAnimations().forEach(animation => animation.cancel());
    }
    el('duelPlayerImpact').classList.add('hidden');
    el('duelOpponentImpact').classList.add('hidden');
    duel.phase = 'attack';
    duel.active = true;
    duel.charge = null;
    duel.readyAt = 0;
    el('duelField').classList.remove('hidden');
    el('duelImage').src = duel.opponent.image;
    el('duelName').textContent = duel.opponent.name + ' ' + gradeLabel(duel.opponent);
    el('duelAttack').classList.remove('hidden');
    el('duelCharge').classList.add('hidden');
    el('duelMessage').textContent = '按「攻擊」開始計時，3 秒內連打 10 下充滿。也可以連按空白鍵。';
    renderDuelTeam();
    renderDuel();
    el('duelAttack').focus();
  }

  function chargeTier(presses) {
    return chargeTiers.findLast(tier => presses >= tier.presses);
  }

  function renderCharge(presses) {
    const tier = chargeTier(presses);
    const disc = el('chargeDisc');
    disc.style.setProperty('--fill', tier.fill + 'turn');
    disc.style.setProperty('--charge-color', tier.color);
    disc.toggleAttribute('data-full', tier.fill === 1);
    disc.setAttribute('aria-valuenow', Math.round(tier.fill * 100));
    disc.setAttribute('aria-valuetext', tier.label);
    el('chargeLabel').textContent = tier.label;
    el('chargePresses').textContent = presses + '／' + maxChargePresses + ' 下';
  }

  function finishCharge(charge) {
    if (duel.charge !== charge) return;
    duel.charge = null;
    cancelAnimationFrame(charge.frame);
    clearTimeout(charge.timeout);
    el('chargeClock').textContent = '0.0 秒';
    duel.readyAt = performance.now() + 700;
    resolveDuelAttack(chargeTier(charge.presses));
  }

  function updateChargeClock(charge) {
    if (duel.charge !== charge) return;
    const remaining = charge.deadline - performance.now();
    if (remaining <= 0) {
      finishCharge(charge);
      return;
    }
    el('chargeClock').textContent = (Math.ceil(remaining / 100) / 10).toFixed(1) + ' 秒';
    charge.frame = requestAnimationFrame(() => updateChargeClock(charge));
  }

  function renderDuel() {
    el('duelScore').textContent = '第 ' + duel.round + '／3 場 · 已勝 ' + duel.wins + ' 場';
    el('duelPlayerBar').value = duel.playerHp;
    el('duelOpponentBar').value = duel.opponentHp;
    el('duelPlayerHp').textContent = 'HP ' + duel.playerHp + '／' + el('duelPlayerBar').max;
    el('duelOpponentHp').textContent = 'HP ' + duel.opponentHp + '／' + el('duelOpponentBar').max;
  }

  function playDuelStrike(attacker, target, impact, damage, direction, delay, defeated) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    attacker.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(' + direction * 22 + '%) scale(1.1)', offset: .45 },
      { transform: 'translateX(0)' },
    ], { duration: 210, delay, easing: 'ease-out' });
    target.animate([
      { transform: 'translateX(0)', opacity: 1 },
      { transform: 'translateX(' + direction * 12 + '%)', filter: 'brightness(1.9)', offset: .32 },
      { transform: defeated ? 'translateY(15%) scale(.8)' : 'translateX(0)', opacity: defeated ? .3 : 1 },
    ], { duration: 180, delay: delay + 80, fill: defeated ? 'forwards' : 'none' });
    impact.textContent = '−' + damage;
    impact.classList.remove('hidden');
    impact.getAnimations().forEach(animation => animation.cancel());
    impact.animate([
      { opacity: 0, transform: 'translateY(8px)' },
      { opacity: 1, offset: .24 },
      { opacity: 0, transform: 'translateY(-28px)' },
    ], { duration: 400, delay: delay + 75, fill: 'both' });
  }

  function attackDuel() {
    if (mode !== 'duel' || !duel.active) return;
    const now = performance.now();
    if (now < duel.readyAt) return;
    if (duel.charge) {
      if (now >= duel.charge.deadline) {
        finishCharge(duel.charge);
        return;
      }
      duel.charge.presses = Math.min(maxChargePresses, duel.charge.presses + 1);
      renderCharge(duel.charge.presses);
      return;
    }
    const charge = { presses: 1, deadline: now + chargeDuration };
    duel.charge = charge;
    el('duelCharge').classList.remove('hidden');
    el('duelMessage').textContent = '連打攻擊鍵，幫圓盤充能！';
    renderCharge(charge.presses);
    updateChargeClock(charge);
    charge.timeout = setTimeout(() => finishCharge(charge), chargeDuration);
  }

  function resolveDuelAttack(tier) {
    const damage = Math.round(attackCaps[starsFor(duel.player)] * tier.power);
    const counterScale = .26 + .17 * (1 - tier.power) / .65;
    duel.opponentHp = Math.max(0, duel.opponentHp - damage);
    const counter = duel.opponentHp ? Math.round(attackCaps[starsFor(duel.opponent)] * counterScale) : 0;
    duel.playerHp = Math.max(0, duel.playerHp - counter);
    const playerImage = el('duelPlayerImage');
    const opponentImage = el('duelImage');
    playDuelStrike(playerImage, opponentImage, el('duelOpponentImpact'), damage, 1, 0, !duel.opponentHp);
    if (counter) playDuelStrike(opponentImage, playerImage, el('duelPlayerImpact'), counter, -1, 210, !duel.playerHp);
    renderDuel();
    if (duel.opponentHp && duel.playerHp) {
      el('duelMessage').textContent = tier.label + ' · 攻擊 ' + damage + '，對手反擊 ' + counter + '。';
      return;
    }
    duel.active = false;
    duel.tired.add(duel.player.id);
    const won = duel.opponentHp === 0;
    if (won) {
      duel.wins++;
      collectPokemon(duel.opponent);
    }
    const exhausted = duel.tired.size === duel.team.length;
    const finished = duel.round === 3 || exhausted;
    duel.phase = finished ? 'finished' : 'between';
    renderDuelTeam();
    renderDuel();
    const result = (won ? '獲勝，已收服對手。' : '這場輸了。') + '最後一擊 ' + damage + '。';
    const summary = '共打 ' + duel.round + ' 場，勝 ' + duel.wins + ' 場。';
    el('duelMessage').textContent = result + (duel.round === 3 ? summary : exhausted ? '全隊都累了，挑戰結束。' + summary : '請換另一隻隊員。');
    el('duelAttack').classList.add('hidden');
    el('duelNext').textContent = finished ? '返回選單' : '下一場';
    el('duelNext').classList.remove('hidden');
    el('duelNext').focus();
  }

  function collectPokemon(pokemon) {
    const id = Number(pokemon.id);
    if (caughtIds.has(id)) return false;
    caughtIds.add(id);
    saveCaught();
    updateDex();
    return true;
  }

  function nextMathQuestion() {
    if (!mathDeck.length) {
      mathDeck = Array.from({length: 81}, (_, i) => [1 + Math.floor(i / 9), 1 + i % 9]);
      for (let i = mathDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mathDeck[i], mathDeck[j]] = [mathDeck[j], mathDeck[i]];
      }
      if (mathQuestion && mathDeck.at(-1).join() === mathQuestion.join()) {
        [mathDeck[0], mathDeck[80]] = [mathDeck[80], mathDeck[0]];
      }
    }
    mathQuestion = mathDeck.pop();
    mathAnswer = '';
    mathSolved = false;
    el('equation').textContent = mathQuestion.join(' × ') + ' = ？';
    el('mathInput').textContent = '等待輸入';
    el('mathMessage').textContent = '';
    el('mathReward').classList.add('hidden');
    el('nextMath').classList.add('hidden');
    el('numberPad').classList.remove('hidden');
  }

  function handleMathKey(key) {
    if (mathSolved) {
      if (key === 'Enter') nextMathQuestion();
      return;
    }
    if (key === 'Enter') {
      if (!mathAnswer) return;
      if (Number(mathAnswer) === mathQuestion[0] * mathQuestion[1]) {
        mathSolved = true;
        el('mathMessage').textContent = '答對了！';
        awardCoins('mathReward');
        el('numberPad').classList.add('hidden');
        el('nextMath').classList.remove('hidden');
        el('nextMath').focus();
        return;
      }
      resetStreak();
      mathAnswer = '';
      el('mathMessage').textContent = '再試一次，連對數已重新計算。';
    } else if (key === 'Backspace') {
      mathAnswer = mathAnswer.slice(0, -1);
    } else if (mathAnswer.length < 2) {
      mathAnswer += key;
    }
    el('mathInput').textContent = mathAnswer || '等待輸入';
  }

  function buildNumberPad() {
    for (const key of ['1','2','3','4','5','6','7','8','9','Backspace','0','Enter']) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'key';
      button.textContent = key === 'Backspace' ? '⌫' : key === 'Enter' ? '送出' : key;
      if (key === 'Backspace') button.setAttribute('aria-label', '退格');
      button.addEventListener('click', () => handleMathKey(key));
      el('numberPad').appendChild(button);
    }
  }

  function loadCaught(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return new Set(Array.isArray(x)?x.map(Number).filter(Number.isFinite):[])}catch{return new Set()}}
  function saveCaught(){localStorage.setItem(STORAGE_KEY,JSON.stringify([...caughtIds].sort((a,b)=>a-b)))}
  function updateDex(){el('caughtCount').textContent=caughtIds.size;el('dexPercent').textContent=(roster.length?caughtIds.size/roster.length*100:0).toFixed(1).replace('.0','')+'%'}
  function collectionItems(){return roster.filter(item=>caughtIds.has(Number(item.id))).sort((a,b)=>Number(a.id)-Number(b.id))}
  function renderCollection(query=''){
    const all=collectionItems(),term=query.trim(),numberTerm=term.replace(/^#/,'');
    const visible=all.filter(item=>!term||item.name.includes(term)||String(item.id).padStart(4,'0').includes(numberTerm)||String(item.id)===numberTerm.replace(/^0+/,''));
    el('collectionCount').textContent=`已收服 ${all.length} / ${roster.length}`;el('collectionPercent').textContent=`完成度 ${(roster.length?all.length/roster.length*100:0).toFixed(1)}%`;
    el('collectionGrid').innerHTML=visible.length?visible.map(item=>`<article class="collection-card"><img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}" loading="lazy"><div class="collection-number">#${String(item.id).padStart(4,'0')}</div><div class="collection-name">${escapeHtml(item.name)}</div><div>${gradeLabel(item)}</div><div class="collection-zhuyin">${escapeHtml(item.zhuyin.zhuyinText)}</div></article>`).join(''):`<div class="collection-empty">${all.length?'找不到符合的收藏。':'還沒有收藏，先去收服第一隻寶可夢吧！'}</div>`;
  }
  function openCollection(){collectionReturnWasBattle=!el('battleScreen').classList.contains('hidden');if(collectionReturnWasBattle&&!locked)stopTimer();el('collectionSearch').value='';renderCollection();el('collectionScreen').classList.remove('hidden');el('collectionSearch').focus()}
  function closeCollection(){el('collectionScreen').classList.add('hidden');if(collectionReturnWasBattle&&(mode==='catch'||mode==='zhuyin')&&current&&!locked&&timeLeft>0)startTimer()}
  function stripTone(value){return value.replace(/^˙|[ˊˇˋ]$/g,'')}function getTone(value){if(value.startsWith('˙'))return '˙';const m=value.match(/[ˊˇˋ]$/);return m?m[0]:''}function formatInput(body,tone=''){return tone==='˙'?tone+body:body+tone}
  function buildKeyboard(){const keyboard=el('keyboard');KEY_ROWS.forEach(row=>{const line=document.createElement('div');line.className=`key-row row-${row.length}`;row.forEach(([physical,zhuyin])=>{const button=document.createElement('button');button.type='button';button.className='key'+(TONES.has(zhuyin)?' tone':'');button.dataset.physical=physical;button.innerHTML=`<span class="key-physical">${physical}</span><span class="key-zhuyin">${zhuyin}</span>`;button.setAttribute('aria-label',`${physical} 鍵，${zhuyin}`);button.addEventListener('click',()=>handleMappedKey(physical));line.appendChild(button)});keyboard.appendChild(line)})}
  function flashKey(key){const button=document.querySelector(`.key[data-physical="${CSS.escape(key)}"]`);if(!button)return;button.classList.add('pressed');setTimeout(()=>button.classList.remove('pressed'),130)}function normalizePhysical(key){if(key.length===1&&/[a-z]/i.test(key))return key.toUpperCase();return key}
  function handleMappedKey(physical){if(locked||!current)return;flashKey(physical);const value=KEY_MAP.get(physical);if(TONES.has(value))handleTone(value);else handleZhuyin(value)}
  function handleZhuyin(symbol){composing+=symbol;renderInput();const target=targets[targetIndex];if(!target)return;if(mode==='zhuyin'&&!target.body.startsWith(composing))return miss();if(composing===target.body){if(!target.tone)completeTarget();else if(target.progress<WEAK_RATIO)applyProgress(target,WEAK_RATIO,'弱攻擊！聲調還沒完成','weak')}}
  function handleTone(tone){const target=targets[targetIndex];if(!target||!composing)return miss();const attempt=formatInput(composing,tone);if(attempt===target.answer)completeTarget();else miss()}
  function commitWithSpace(){if(locked||!current||!composing)return;const target=targets[targetIndex];if(composing===target.body){if(!target.tone)completeTarget();else{if(target.progress<WEAK_RATIO)applyProgress(target,WEAK_RATIO,'弱攻擊！聲調還沒完成','weak');composing='';advanceTarget()}}else miss()}
  function completeTarget(){const target=targets[targetIndex];if(!target)return;applyProgress(target,1,target.progress?'補上聲調，完整命中！':'完整命中！','good');composing='';if(locked&&mode==='zhuyin')renderInput();advanceTarget()}
  function applyProgress(target,newProgress,text,type){const old=target.progress;target.progress=Math.max(old,Math.min(1,newProgress));const unit=100/targets.length;hp=Math.max(0,100-targets.reduce((sum,item)=>sum+item.progress*unit,0));updateHp();renderGuide();showMessage(text,type);animateHit(type,text,target.progress-old);if(hp<.001&&targets.every(item=>item.progress===1))capturePokemon()}
  function advanceTarget(){if(locked)return;const next=findNextIncomplete(targetIndex+1);if(next===-1){if(hp<.001)capturePokemon();return}targetIndex=next;composing='';renderGuide();renderInput()}
  function findNextIncomplete(start){for(let step=0;step<targets.length;step++){const i=(start+step)%targets.length;if(targets[i].progress<1)return i}return -1}
  function miss(){if(mode==='zhuyin')resetStreak();composing='';renderInput();showMessage('MISS！再看一次黃色目標','bad');animateHit('miss','MISS',0)}function deleteInput(){if(locked)return;composing=[...composing].slice(0,-1).join('');renderInput()}function clearInput(){if(locked)return;composing='';renderInput();showMessage('已清除，重新輸入目前音節')}
  function renderInput(){const target=targets[targetIndex];el('inputDisplay').textContent=composing||'等待輸入';el('inputDisplay').classList.toggle('weak',!!target&&target.progress===WEAK_RATIO&&composing===target.body)}
  function renderGuide(){el('syllableGuide').innerHTML=targets.map((target,index)=>`<div class="guide-item ${index===targetIndex?'current ':''}${target.progress===1?'done':target.progress>0?'weak':''}"><span class="guide-char">${escapeHtml(target.char)}</span><span class="guide-zhuyin">${escapeHtml(target.answer)}</span></div>`).join('')}
  function escapeHtml(value){const span=document.createElement('span');span.textContent=value;return span.innerHTML}function showMessage(text,type=''){el('message').textContent=text;el('message').className='message '+type}
  function animateHit(type,label,delta){const image=el('pokemonImage');image.classList.remove('hit','miss');void image.offsetWidth;image.classList.add(type==='miss'?'miss':'hit');const pop=document.createElement('div');pop.className='damage-pop '+(type==='weak'?'weak':type==='miss'?'miss':'');pop.textContent=type==='miss'?'MISS':`${label} −${Math.round(delta*100/targets.length)}%`;el('scene').appendChild(pop);setTimeout(()=>pop.remove(),760)}
  function updateHp(){const shown=Math.max(0,hp);el('hpFill').style.width=shown+'%';el('hpText').textContent=Math.round(shown)+'%';el('hpFill').classList.toggle('mid',shown<=60&&shown>25);el('hpFill').classList.toggle('low',shown<=25);el('hpFill').parentElement.setAttribute('aria-valuenow',Math.round(shown))}
  function chooseScene(){let index;do{index=Math.floor(Math.random()*SCENES.length)}while(SCENES.length>1&&index===lastScene);lastScene=index;const [id,name]=SCENES[index];el('scene').className=`scene scene-${id}`;el('sceneName').textContent=name;return id}
  function randomPokemon(){if(roster.length<2)return roster[0];let pick;do{pick=roster[Math.floor(Math.random()*roster.length)]}while(pick.id===lastId);return pick}
  function startEncounter(forcedId,forcedScene){stopTimer();
    const reward = el('zhuyinReward');
    reward.classList.add('hidden');
    el('keyboard').before(reward);
    el('keyboard').classList.remove('hidden');locked=false;el('resultLayer').classList.add('hidden');el('resultLayer').innerHTML='';current=forcedId?roster.find(p=>Number(p.id)===Number(forcedId)):randomPokemon();if(!current){showMessage('找不到可用資料','bad');return}lastId=current.id;hp=100;timeLeft=ROUND_SECONDS;targetIndex=0;composing='';targets=current.zhuyin.chars.filter(c=>!c.nonChinese).map(c=>({char:c.char,answer:c.selected,body:stripTone(c.selected),tone:getTone(c.selected),progress:0}));el('pokemonNumber').textContent='#'+String(current.id).padStart(4,'0');el('pokemonName').textContent=current.name;el('pokemonImage').src=current.image;el('pokemonImage').alt=current.name;if(forcedScene){const index=SCENES.findIndex(x=>x[0]===forcedScene);lastScene=index;el('scene').className=`scene scene-${forcedScene}`;el('sceneName').textContent=index>=0?SCENES[index][1]:forcedScene}else chooseScene();updateHp();updateTimer();renderGuide();renderInput();showMessage('照著黃色目標輸入吧！');el('startScreen').classList.add('hidden');el('battleScreen').classList.remove('hidden');startTimer()}
  function startTimer(){if(timerId||locked)return;timerId=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){if(mode==='zhuyin')resetStreak();escapePokemon()}},1000)}function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}function updateTimer(){el('timer').innerHTML=`⏱ <b>${Math.max(0,timeLeft)}</b> 秒`;el('timer').classList.toggle('urgent',timeLeft<=5)}
  function capturePokemon(){if(locked)return;locked=true;stopTimer();const already=!collectPokemon(current);el('resultLayer').innerHTML=`<div><div class="capture-ball"></div><h3>收服成功！</h3><p>${already?'已經收藏過囉！':'已加入我的收藏！'}</p></div>`;el('resultLayer').classList.remove('hidden');
    if (mode === 'zhuyin') {
      const reward = el('zhuyinReward');
      el('resultLayer').firstElementChild.appendChild(reward);
      awardCoins('zhuyinReward', current);
    }
    addRoundReturn();
  }
  function escapePokemon(){if(locked)return;locked=true;stopTimer();el('resultLayer').innerHTML='<div><div class="escape-cloud">💨</div><h3>寶可夢逃走了！</h3><p>之後還有機會再遇到牠。</p></div>';el('resultLayer').classList.remove('hidden');addRoundReturn()}
  function addRoundReturn() {
    const button = document.createElement('button');
    button.className = 'back-button practice-next';
    button.textContent = '返回選單';
    button.addEventListener('click', () => showMode('home'));
    const result = el('resultLayer').firstElementChild;
    if (mode === 'zhuyin') {
      const next = document.createElement('button');
      next.className = 'back-button practice-next';
      next.textContent = '下一題';
      next.addEventListener('click', () => startEncounter());
      result.appendChild(next);
    }
    result.appendChild(button);
    button.focus();
  }

  document.addEventListener('keydown',event=>{if(!el('collectionScreen').classList.contains('hidden')){if(event.key==='Escape'){event.preventDefault();closeCollection()}return}
    if (event.ctrlKey || event.altKey || event.metaKey || event.isComposing) return;
    if (mode === 'duel') {
      if (duel.active && (event.code === 'Space' || (event.key === 'Enter' && event.target === el('duelAttack')))) {
        event.preventDefault();
        if (!event.repeat) attackDuel();
      }
      return;
    }
    if (mode === 'math') {
      if (event.key === 'Enter' && event.target.closest('button:not(.key)')) return;
      if (/^[0-9]$/.test(event.key) || ['Backspace','Enter'].includes(event.key)) {
        event.preventDefault();
        if (event.key !== 'Enter' || !event.repeat) handleMathKey(event.key);
      }
      return;
    }
    if (mode !== 'catch' && mode !== 'zhuyin' || locked) return;
    const key=normalizePhysical(event.key);if(KEY_MAP.has(key)){event.preventDefault();handleMappedKey(key)}else if(event.code==='Space'){event.preventDefault();commitWithSpace()}else if(event.key==='Backspace'){event.preventDefault();deleteInput()}else if(event.key==='Escape'){event.preventDefault();clearInput()}});
  el('startButton').addEventListener('click', startPaidRound);
  el('homeButton').addEventListener('click', () => showMode('home'));
  el('practiceButton').addEventListener('click', () => {
    if (!roster.length) {
      el('homeNotice').textContent = '找不到可用的注音題目。';
      el('homeNotice').classList.remove('hidden');
      return;
    }
    showMode('zhuyin');
    startEncounter();
  });
  el('mathButton').addEventListener('click', () => {
    showMode('math');
    if (!mathQuestion) nextMathQuestion();
    el('equation').setAttribute('tabindex','-1');
    el('equation').focus();
  });
  el('nextMath').addEventListener('click', () => {
    nextMathQuestion();
    el('equation').focus();
  });
  el('duelAttack').addEventListener('click', attackDuel);
  el('duelSearch').addEventListener('input', renderTeamOptions);
  el('duelBegin').addEventListener('click', () => {
    if (mode !== 'duel' || duel.phase !== 'setup' || !duel.selected.size) return;
    duel.team = duel.options.filter(pokemon => duel.selected.has(pokemon.id));
    chooseDuelMember();
  });
  el('duelNext').addEventListener('click', () => {
    if (mode !== 'duel') return;
    if (duel.phase === 'finished') showMode('home');
    else if (duel.phase === 'between') chooseDuelMember();
  });
  buildNumberPad();
  renderWallet();
  window.addEventListener('storage', event => {
    if (event.key === WALLET_KEY || event.key === null) {
      wallet = readWallet();
      renderWallet();
    }
  });
  el('collectionStartButton').addEventListener('click',openCollection);el('collectionBattleButton').addEventListener('click',openCollection);el('collectionBackButton').addEventListener('click',closeCollection);el('collectionSearch').addEventListener('input',event=>renderCollection(event.target.value));el('deleteButton').addEventListener('click',deleteInput);el('clearButton').addEventListener('click',clearInput);buildKeyboard();updateDex();renderInput();
  window.__POKEMON_ZHUYIN_TEST__={startEncounterById:(id,scene)=>{showMode('catch');startEncounter(id,scene)},press:key=>{const normalized=normalizePhysical(key);if(KEY_MAP.has(normalized))handleMappedKey(normalized);else if(key===' ')commitWithSpace()},typeKeys:keys=>[...keys].forEach(key=>window.__POKEMON_ZHUYIN_TEST__.press(key)),forceTimeout:escapePokemon,openCollection,closeCollection,renderCollection,setCaughtIds:ids=>{caughtIds=new Set(ids.map(Number));saveCaught();updateDex()},state:()=>({id:current?.id,hp,targetIndex,composing,targets:targets.map(x=>({...x})),scene:SCENES[lastScene]?.[0],caughtIds:[...caughtIds],collectionOpen:!el('collectionScreen').classList.contains('hidden')})};
})();
